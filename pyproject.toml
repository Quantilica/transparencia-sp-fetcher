[project]
name = "transparencia-sp-fetcher"
version = "0.1.0"
description = "Coletor e conversor Lake Hive de remuneração dos servidores de SP"
readme = "README.md"
authors = [
    { name = "Komesu, D.K.", email = "daniel@dkko.me" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["transparencia-sp", "quantilica", "dados-abertos", "lake", "brazil"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "quantilica-core>=0.15.0",
]

[project.optional-dependencies]
analysis = [
    "polars>=1.0.0",
    "quantilica-analytics>=0.7.0",
]
# Série antiga (RAR): libarchive-c é wheel puro, mas exige a biblioteca libarchive do
# sistema (Fedora: libarchive; Debian/Ubuntu: libarchive13). O 7zip do Fedora não lê RAR.
rar = [
    "libarchive-c>=5.1",
]

[project.urls]
Homepage = "https://github.com/Quantilica/transparencia-sp-fetcher"
Repository = "https://github.com/Quantilica/transparencia-sp-fetcher"
Issues = "https://github.com/Quantilica/transparencia-sp-fetcher/issues"

[project.scripts]
transparencia-sp-fetcher = "transparencia_sp_fetcher.cli:main"

[project.entry-points."quantilica.fetchers"]
transparencia-sp = "transparencia_sp_fetcher.plugin:app"


[project.entry-points."quantilica.lake"]
transparencia-sp = "transparencia_sp_fetcher.lake:converter"


[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-cov",
    "quantilica-cli>=0.14.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/transparencia_sp_fetcher"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
